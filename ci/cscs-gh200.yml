include:
  - remote: 'https://gitlab.com/cscs-ci/recipes/-/raw/master/templates/v2/.ci-ext.yml'

stages:
  - single-rank
  - multi-rank # NOTE: only run if the single-rank tests pass.

# The job script runs on the first allocated node; Julia runs in the julia uenv via srun, and every test file is launched as a nested
# job step (IGG_TEST_MPIEXEC, see test/runtests.jl). IGG selects the GPU of each process by its node-local rank (select_device), so
# no per-task GPU binding is requested: every process sees all GPUs of its node.
# Julia uses a dedicated, persistent depot for this CI ($SCRATCH/.julia-igg-ci). NOTE: it is set with `env` after srun, as the juliaup
# view of the uenv sets JULIA_DEPOT_PATH itself; the nested job steps inherit it.
.gh200:
  extends: .baremetal-runner-daint-gh200
  variables:
    SLURM_JOB_NUM_NODES: 1
    SLURM_TIMELIMIT: '00:30:00'
    JULIA_UENV: 'julia/26.3:v1'
    JULIA_CUDA_USE_COMPAT: 'false'
    IGG_TEST_BACKEND: 'CUDA'           # Fail instead of skipping the GPU tests if CUDA is not functional.
    IGG_TEST_MPIEXEC: 'srun --overlap'
    IGG_TEST_FILES: ''                 # Test files to run (default: all).
  script:
    - |
      srun -n 1 --overlap --uenv=$JULIA_UENV --view=juliaup env JULIA_DEPOT_PATH=$SCRATCH/.julia-igg-ci julia --project --startup-file=no -e '
        using Pkg
        Pkg.instantiate()
        Pkg.test(; coverage=true, test_args=String.(split(get(ENV, "IGG_TEST_FILES", ""))))'
    - |
      srun -n 1 --overlap --uenv=$JULIA_UENV --view=juliaup env JULIA_DEPOT_PATH=$SCRATCH/.julia-igg-ci julia --startup-file=no -e '
        using Pkg
        Pkg.activate(; temp=true)
        Pkg.add("CoverageTools")
        using CoverageTools
        LCOV.writefile("lcov.info", vcat(process_folder("src"), process_folder("ext")))'
    - bash ci/codecov_upload.sh gh200

gh200 - 1 rank:
  extends: .gh200
  stage: single-rank

gh200 - 1 node, 4 ranks:
  extends: .gh200
  stage: multi-rank
  parallel:
    matrix:
      - IGG_CUDAAWARE_MPI: ['0', '1']
  variables:
    IGG_TEST_NPROCS: 4
    IGG_TEST_FILES: 'test_finalize_global_grid.jl test_gather.jl test_select_device.jl test_update_halo.jl'

gh200 - 2 nodes, 8 ranks:
  extends: .gh200
  stage: multi-rank
  variables:
    SLURM_JOB_NUM_NODES: 2
    SLURM_NTASKS_PER_NODE: 4
    IGG_TEST_NPROCS: 8
    IGG_CUDAAWARE_MPI: '1'
    IGG_TEST_MPIEXEC: 'srun --overlap -N 2' # NOTE: the node count is given explicitly, as nested job steps would else use the single node of the enclosing step.
    IGG_TEST_FILES: 'test_finalize_global_grid.jl test_gather.jl test_select_device.jl test_update_halo.jl'

gh200 - 1 rank, Polyester:
  extends: .gh200
  stage: multi-rank
  variables:
    IGG_USE_POLYESTER: '1'
    JULIA_NUM_THREADS: 8
    IGG_TEST_FILES: 'test_update_halo.jl'
