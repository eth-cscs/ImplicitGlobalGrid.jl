# Expected results of the probes in this directory, compared with the probe output by check.jl (stack check, ci/cscs-stack.yml).
# The xstream entries are also the table "Behaviour per version" of docs/src/stream_semantics.md (generated by docs/make.jl; `label`: its
# column header). Version ranges: from <= version < below (no `below`: no upper bound). A version without an entry is a mismatch.
# When the check fails for a new release (MISMATCH lines name the case, version and measured verdict): if a XSTREAM verdict changed, set
# `below` of the current entry to that version and add an entry from it with the new verdicts; if STREAMS or PSCORRECT fail, or the
# overlap is lost, fix ImplicitGlobalGrid or ParallelStencil instead.

# xstream_probe.jl: verdict (HOST_BLOCKED, GPU_SERIALIZED or CONCURRENT) per case with the implicit synchronization of the GPU package
# (optout=0); `optout` is the verdict of all cases with enable_synchronization!(A, false) (optout=1, if the package provides it).

[[xstream]]
backend                = "CUDA"
label                  = "CUDA.jl 5.4–6.2"
from                   = "5.4.0"
below                  = "6.3.0"
measured               = "5.8.5, 6.2.2 (CUDA.jl < 5.8.3 does not run with CUDA 13 drivers, as on Daint)"
kernel_other           = "CONCURRENT"
kernel_same            = "CONCURRENT"
pointer_same           = "CONCURRENT"
pointer_same_tasklocal = "CONCURRENT"
optout                 = "CONCURRENT"

[[xstream]]
backend                = "CUDA"
label                  = "CUDA.jl 6.3–6.4"
from                   = "6.3.0"
below                  = "6.5.0"
measured               = "6.4.2"
kernel_other           = "CONCURRENT"
kernel_same            = "HOST_BLOCKED"
pointer_same           = "HOST_BLOCKED"
pointer_same_tasklocal = "CONCURRENT"
optout                 = "CONCURRENT"

[[xstream]]
backend                = "CUDA"
label                  = "CUDA.jl ≥ 6.5"
from                   = "6.5.0"
measured               = "6.5.0"
kernel_other           = "CONCURRENT"
kernel_same            = "GPU_SERIALIZED"
pointer_same           = "HOST_BLOCKED"
pointer_same_tasklocal = "CONCURRENT"
optout                 = "CONCURRENT"

[[xstream]]
backend                = "AMDGPU"
label                  = "AMDGPU.jl ≥ 2.8"
from                   = "2.8.0"
measured               = "2.8.0, 2.10.0 (MI250X, MI300A)"
kernel_other           = "CONCURRENT"
kernel_same            = "HOST_BLOCKED"
pointer_same           = "HOST_BLOCKED"
pointer_same_tasklocal = "CONCURRENT"
optout                 = "CONCURRENT"

# overlap_probe.jl: @hide_communication is expected to overlap the communication with the computation if the caller disabled the implicit
# synchronization (optout=1), if ParallelStencil suspends it and the GPU package allows it (psopt=1 and bkopt=1), or if the GPU package does
# not synchronize implicitly between the streams of a task (kernel_same = CONCURRENT above); otherwise, it is expected to be serialized.
# Verdict from hidden_split: OVERLAP if >= overlap_min, SERIALIZED if <= serialized_max, else UNCLEAR (reported, never a mismatch). A case
# is only judged if min(split, comm) >= judge_min_ms and >= judge_min_ratio * max(split, comm): when the communication or the computation
# takes almost no time, there is nothing measurable to hide.
[overlap]
overlap_min     = 0.5
serialized_max  = 0.1
judge_min_ms    = 0.1
judge_min_ratio = 0.2

# streams_probe.jl: no stale element (stale = 0) in any case. correctness_probe.jl: bitwise equal results (equal = true).
